name: Workers compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workerd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Build SDK
        run: |
          npm ci
          npm run build -w clockify-sdk-ts-115
      - name: Run workerd tests
        working-directory: workers-compat
        run: |
          npm ci
          npm test
      - name: Verify Worker bundling
        working-directory: workers-compat
        run: npm run bundle
