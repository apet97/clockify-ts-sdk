name: Mutation

on:
  workflow_dispatch:
    inputs:
      target:
        description: Mutation target to run
        required: true
        default: all
        type: choice
        options:
          - all
          - wrapper
          - mcp
          - cli
  # TST-2: dispatch-only meant mutation proof ran only when a human asked, so
  # a score regression stayed invisible between requests (one five-day gap
  # cost the SSRF guard ~9.5 points). Weekly Monday 05:00 UTC run keeps the
  # floors observed; manual dispatch stays for targeted runs.
  schedule:
    - cron: "0 5 * * 1"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CLOCKIFY_API_KEY: ""
  CLOCKIFY_WORKSPACE_ID: ""
  # Scheduled runs carry no dispatch inputs; resolve once and use everywhere.
  MUTATION_TARGET: ${{ inputs.target || 'all' }}

jobs:
  mutation:
    name: Stryker mutation (${{ inputs.target || 'all' }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js 22.13.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspaces (root)
        run: npm ci

      - name: Generate + sync TS SDK (local generator)
        run: make sdk-codegen

      - name: Run full mutation gate
        if: ${{ env.MUTATION_TARGET == 'all' }}
        run: make mutation

      - name: Run wrapper mutation
        if: ${{ env.MUTATION_TARGET == 'wrapper' }}
        run: npm run mutation -w clockify-sdk-ts-115

      - name: Check wrapper mutation floor
        if: ${{ env.MUTATION_TARGET == 'wrapper' }}
        run: node scripts/check-mutation-score.mjs --package wrapper

      - name: Run MCP mutation
        if: ${{ env.MUTATION_TARGET == 'mcp' }}
        run: npm run mutation -w @apet97/clockify-mcp-115

      - name: Check MCP mutation floor
        if: ${{ env.MUTATION_TARGET == 'mcp' }}
        run: node scripts/check-mutation-score.mjs --package mcp

      - name: Run CLI mutation
        if: ${{ env.MUTATION_TARGET == 'cli' }}
        run: npm run mutation -w @apet97/clockify-cli-115

      - name: Check CLI mutation floor
        if: ${{ env.MUTATION_TARGET == 'cli' }}
        run: node scripts/check-mutation-score.mjs --package cli

      - name: Verify expected mutation reports
        id: mutation-reports
        if: always()
        shell: bash
        run: |
          case "$MUTATION_TARGET" in
            all)
              reports=$'wrapper/reports/mutation/mutation.json\nmcp/reports/mutation/mutation.json\ncli/reports/mutation/mutation.json'
              ;;
            wrapper)
              reports='wrapper/reports/mutation/mutation.json'
              ;;
            mcp)
              reports='mcp/reports/mutation/mutation.json'
              ;;
            cli)
              reports='cli/reports/mutation/mutation.json'
              ;;
            *)
              echo "Unsupported mutation target: $MUTATION_TARGET" >&2
              exit 1
              ;;
          esac
          {
            echo 'paths<<EOF'
            echo "$reports"
            echo EOF
          } >> "$GITHUB_OUTPUT"
          while IFS= read -r report; do
            test -f "$report"
          done <<< "$reports"

      - name: Upload mutation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-reports-${{ env.MUTATION_TARGET }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: ${{ steps.mutation-reports.outputs.paths }}
