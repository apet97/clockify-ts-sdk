name: Workspace CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  packages:
    name: ${{ matrix.target.package }} / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ["22.13.0", "24"]
        target:
          - package: wrapper
            workspace: clockify-sdk-ts-115
          - package: cli
            workspace: "@apet97/clockify-cli-115"
          - package: mcp
            workspace: "@apet97/clockify-mcp-115"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Generate SDK and build dependency
        run: |
          make sdk-codegen
          npm run build -w clockify-sdk-ts-115
      - run: npm run lint -w ${{ matrix.target.workspace }}
      - run: npm run type-check -w ${{ matrix.target.workspace }}
      - run: npm test -w ${{ matrix.target.workspace }}
      - run: npm run build -w ${{ matrix.target.workspace }}
      - if: matrix.target.package == 'wrapper'
        run: npm run build:smoke -w clockify-sdk-ts-115
      - if: matrix.node == '22.13.0'
        run: node scripts/pack-snapshot.mjs --pkg=${{ matrix.target.package }} --check

  contracts:
    name: Contracts and coverage / Node 22.13.0
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.13.0"
          cache: npm
      - run: npm ci
      - run: make sdk-codegen
      - run: npm run build
      - name: Doc and contract drift suite
        run: make contract-gates
        env:
          CLOCKIFY_API_KEY: ""
          CLOCKIFY_WORKSPACE_ID: ""
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
      - name: Governance and inventory audit
        run: make governance-audit
        env:
          CLOCKIFY_API_KEY: ""
          CLOCKIFY_WORKSPACE_ID: ""
      - name: Executable contract and coverage proof
        run: >-
          make sdk-codegen-drift sdk-codegen-test codegen-determinism
          build-determinism generator-comparison pack-smoke coverage mutation-ci
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
      - run: node --test scripts/check-npm-audit.test.mjs && node scripts/check-npm-audit.mjs

  supply-chain:
    name: Supply chain and secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # gitleaks scans history, so a shallow clone would hide every secret
          # committed before the tip.
          fetch-depth: 0
      - name: Lint the workflow files themselves
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          fail-on-error: true
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Reads the PR's dependency diff, so it has nothing to compare on a push.
      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # Both SPDX forms of each family. `GPL-3.0-only` is a distinct
          # identifier from `GPL-3.0-or-later` and passes a filter naming
          # only the latter.
          deny-licenses: >-
            AGPL-1.0-only, AGPL-1.0-or-later,
            AGPL-3.0-only, AGPL-3.0-or-later,
            GPL-2.0-only, GPL-2.0-or-later,
            GPL-3.0-only, GPL-3.0-or-later
