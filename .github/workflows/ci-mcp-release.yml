name: Release @apet97/clockify-mcp-115 to npm

# A pushed mcp-v* tag may publish only after the complete MCP proof, exact
# artifact/integrity checks, and explicit MCPB/SPDX asset validation. Manual
# dispatch runs the same proof and records a proof_only receipt; it never
# publishes or creates/updates a GitHub release.

on:
  push:
    tags:
      - "mcp-v*.*.*"
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  proof-and-release:
    name: Prove and release @apet97/clockify-mcp-115
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set release state path
        run: echo "RELEASE_STATE_FILE=$RUNNER_TEMP/clockify-mcp-release-state.json" >> "$GITHUB_ENV"

      - name: Setup Node.js 22.13.0
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22.13.0"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Initialize release receipt
        working-directory: .
        env:
          RELEASE_WORKFLOW: ${{ github.workflow }}
        run: |
          PACKAGE_NAME="$(node -p "require('./mcp/package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./mcp/package.json').version")"
          {
            echo "PACKAGE_NAME=$PACKAGE_NAME"
            echo "PACKAGE_VERSION=$PACKAGE_VERSION"
          } >> "$GITHUB_ENV"
          node scripts/release-state.mjs init \
            --file "$RELEASE_STATE_FILE" \
            --workflow "$RELEASE_WORKFLOW" \
            --event-name "$GITHUB_EVENT_NAME" \
            --ref-name "$GITHUB_REF_NAME" \
            --source-sha "$GITHUB_SHA" \
            --package-name "$PACKAGE_NAME" \
            --version "$PACKAGE_VERSION"

      - name: Install workspaces
        working-directory: .
        run: npm ci

      - name: Verify package, manifest, tag, and SDK peer
        working-directory: .
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          MCP_PACKAGE_NAME="$(node -p "require('./mcp/package.json').name")"
          MCP_VERSION="$(node -p "require('./mcp/package.json').version")"
          MANIFEST_NAME="$(node -p "require('./mcp/manifest.json').name")"
          MANIFEST_VERSION="$(node -p "require('./mcp/manifest.json').version")"
          SDK_PEER_RANGE="$(node -p "require('./mcp/package.json').peerDependencies['clockify-sdk-ts-115']")"
          TAG_VERSION=""

          if [ "$MCP_PACKAGE_NAME" != "@apet97/clockify-mcp-115" ]; then
            echo "::error::Unexpected MCP package name: $MCP_PACKAGE_NAME"
            exit 1
          fi
          if [ "$MANIFEST_NAME" != "clockify115-mcp" ]; then
            echo "::error::Unexpected MCPB manifest name: $MANIFEST_NAME"
            exit 1
          fi
          if [ "$MCP_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::mcp/package.json ($MCP_VERSION) does not match mcp/manifest.json ($MANIFEST_VERSION)"
            exit 1
          fi

          SDK_VERSION="$(printf '%s\n' "$SDK_PEER_RANGE" | sed -n 's/^>=\([^ ]*\) <1$/\1/p')"
          if [ -z "$SDK_VERSION" ]; then
            echo "::error::Unexpected clockify-sdk-ts-115 peer range: $SDK_PEER_RANGE"
            exit 1
          fi

          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#mcp-v}"
            if [ "$GITHUB_REF_NAME" = "$TAG_VERSION" ] || [ "$MCP_VERSION" != "$TAG_VERSION" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match MCP package version $MCP_VERSION"
              exit 1
            fi
          fi

          npm view "clockify-sdk-ts-115@${SDK_VERSION}" version > /dev/null
          {
            echo "MCP_PACKAGE_NAME=$MCP_PACKAGE_NAME"
            echo "MCP_VERSION=$MCP_VERSION"
            echo "MANIFEST_NAME=$MANIFEST_NAME"
            echo "MANIFEST_VERSION=$MANIFEST_VERSION"
            echo "SDK_VERSION=$SDK_VERSION"
            echo "TAG_VERSION=$TAG_VERSION"
          } >> "$GITHUB_ENV"

      - name: Generate and verify the SDK
        working-directory: .
        run: |
          make sdk-codegen
          make sdk-codegen-drift sdk-codegen-test
          npm run build -w clockify-sdk-ts-115

      - name: Run full MCP gates
        working-directory: .
        run: |
          npm run lint -w @apet97/clockify-mcp-115
          npm run type-check -w @apet97/clockify-mcp-115
          npm test -w @apet97/clockify-mcp-115
          npm run build -w @apet97/clockify-mcp-115
          make mcp-tool-manifest-drift mcp-write-safety mcp-contract
          npm pack --dry-run -w @apet97/clockify-mcp-115

      - name: Audit production dependencies (governed exceptions)
        working-directory: .
        run: |
          node --test scripts/check-npm-audit.test.mjs
          node scripts/check-npm-audit.mjs

      - name: Build and validate MCPB and SPDX assets
        working-directory: .
        run: |
          make mcpb-validate
          make mcpb-smoke
          make secret-hygiene
          test -s "mcp/clockify115-mcp-${MCP_VERSION}.mcpb"
          test -s "mcp/clockify115-mcp-${MCP_VERSION}.spdx.json"

      - name: Pack exact artifact
        working-directory: .
        run: |
          PACK_DIR="$RUNNER_TEMP/clockify-mcp-pack"
          PACK_JSON="$PACK_DIR/pack.json"
          mkdir -p "$PACK_DIR"
          npm pack -w @apet97/clockify-mcp-115 --json --pack-destination "$PACK_DIR" > "$PACK_JSON"
          PACKAGE_FILENAME="$(node -e '
            const { readFileSync } = require("node:fs");
            process.stdout.write(JSON.parse(readFileSync(process.argv[1], "utf8"))[0].filename);
          ' "$PACK_JSON")"
          PACKAGE_TARBALL="$PACK_DIR/$PACKAGE_FILENAME"
          LOCAL_INTEGRITY="$(node -e '
            const { createHash } = require("node:crypto");
            const { readFileSync } = require("node:fs");
            process.stdout.write(`sha512-${createHash("sha512").update(readFileSync(process.argv[1])).digest("base64")}`);
          ' "$PACKAGE_TARBALL")"
          {
            echo "PACKAGE_TARBALL=$PACKAGE_TARBALL"
            echo "LOCAL_INTEGRITY=$LOCAL_INTEGRITY"
          } >> "$GITHUB_ENV"
          node scripts/release-state.mjs set-artifact \
            --file "$RELEASE_STATE_FILE" \
            --path "$PACKAGE_TARBALL" \
            --integrity "$LOCAL_INTEGRITY"

      - name: Publish to npm
        if: github.event_name == 'push' && github.ref_type == 'tag'
        working-directory: .
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          node scripts/release-publish.mjs \
            --file "$RELEASE_STATE_FILE" \
            --package-name "$PACKAGE_NAME" \
            --version "$PACKAGE_VERSION" \
            --tarball "$PACKAGE_TARBALL" \
            --local-integrity "$LOCAL_INTEGRITY"

      - name: Registry smoke
        working-directory: .
        run: |
          if [ "$GITHUB_EVENT_NAME" != "push" ]; then
            echo "Registry smoke skipped for proof-only dispatch"
            exit 0
          fi
          if node scripts/registry-smoke.mjs mcp --version "$MCP_VERSION" --timeout-ms 120000; then
            node scripts/release-state.mjs registry-smoke --file "$RELEASE_STATE_FILE" --status passed
          else
            node scripts/release-state.mjs registry-smoke --file "$RELEASE_STATE_FILE" --status failed
          fi

      - name: Check npm provenance/attestation
        working-directory: .
        run: |
          if [ "$GITHUB_EVENT_NAME" != "push" ]; then
            echo "npm attestation query skipped for proof-only dispatch"
            exit 0
          fi
          node scripts/release-attestation.mjs \
            --file "$RELEASE_STATE_FILE" \
            --package-name "$PACKAGE_NAME" \
            --version "$PACKAGE_VERSION"

      - name: Create or update GitHub release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "MCP ${MCP_VERSION}"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "MCP ${MCP_VERSION}"
          fi
          gh release upload "$GITHUB_REF_NAME" \
            "mcp/clockify115-mcp-${MCP_VERSION}.mcpb" \
            "mcp/clockify115-mcp-${MCP_VERSION}.spdx.json" \
            --clobber
          node scripts/release-state.mjs github-release --file "$RELEASE_STATE_FILE" --status present

      - name: Finalize release receipt
        if: always()
        working-directory: .
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" != "success" ]; then
            node scripts/release-state.mjs fail --file "$RELEASE_STATE_FILE"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            node scripts/release-state.mjs proof-only --file "$RELEASE_STATE_FILE"
          fi
          node scripts/release-state.mjs show --file "$RELEASE_STATE_FILE" > "$RUNNER_TEMP/clockify-mcp-release-receipt.json"
          cat "$RUNNER_TEMP/clockify-mcp-release-receipt.json" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' release_receipt_finalized >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: mcp-release-receipt
          path: ${{ runner.temp }}/clockify-mcp-release-state.json
          if-no-files-found: error
