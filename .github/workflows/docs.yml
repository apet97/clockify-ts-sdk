name: Docs

on:
  # No tag trigger: this repo creates only package-prefixed tags
  # (wrapper-v*/cli-v*/mcp-v*; check-tag-hygiene.mjs forbids bare
  # semver), so a bare `v*.*.*` pattern here could never fire. Main-push
  # already redeploys Pages on every merge; workflow_dispatch covers a
  # manual rebuild.
  push:
    branches: [main]
  workflow_dispatch:

# Opt in to the Node.js 24 runner for actions still pinned to Node 20
# major versions. Same rationale as ci.yml and release.yml — see
# ci.yml's comment block for the full reasoning.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent docs deployment; queue runs cancel
# in-progress ones (we always want the latest tag's docs on Pages).
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build TypeDoc and deploy to Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    defaults:
      run:
        working-directory: wrapper
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspaces (root)
        working-directory: .
        run: npm ci

      - name: Generate + sync TS SDK (local generator)
        working-directory: .
        run: make sdk-codegen

      - name: Build TypeDoc site
        run: npm run docs

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          # Auto-enable GitHub Pages if it's not already on for the
          # repo (avoids the 404 "Pages not found" failure on the
          # first tag push to a fresh repo). Requires the
          # `pages: write` permission already declared above.
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/api

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
