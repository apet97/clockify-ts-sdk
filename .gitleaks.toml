# gitleaks configuration for clockify-ts-sdk.
#
# Adding an entry here is a security decision. State what the matched string
# actually is and why it cannot authenticate anything.
#
# Measured against gitleaks 8.24.3 (what the CI action installs) and 8.30.1
# (local): a `paths` entry excludes the matching file from scanning ENTIRELY.
# Pairing it with `regexes` does not narrow that — under the default OR
# condition either match is enough, and 8.24.3 does not honour the
# `[[allowlists]]` array form that carries `condition = "AND"` at all, so a
# config written that way silently allowlists nothing there.
#
# This file therefore uses the single `[allowlist]` table both versions read
# identically, and states the cost plainly: everything under `paths` is
# unscanned. Precision lives in the rule below. Keep `paths` short and pointed
# at generated files a human never writes a credential into, and prove the
# scoping with `scripts/gitleaks-config.test.sh` rather than asserting it.

[extend]
useDefault = true

[allowlist]
description = "Generated attestation artifacts, credential-leak test fixtures, and untracked agent transcripts"
paths = [
    # SHA-256 digests of every governed campaign input; a bare 64-hex string
    # trips the generic-api-key entropy rule. All three are written by
    # scripts/record-live-evidence-currentness.mjs and the campaign runner from
    # fixed templates of hashes and timestamps. No code path puts a credential
    # in them.
    '''docs/live-evidence-currentness\.json''',
    '''spec/evidence/live-evidence-campaign-receipt\.json''',
    '''spec/evidence/live-evidence-manifest\.json''',
    # Negative-test fixtures. That suite asserts the MCPB bundler REFUSES to
    # ship a bundle containing npm credentials, so its self-labelled fake
    # tokens are the input it scans for.
    '''scripts/mcpb-artifacts\.test\.mjs''',
    # Historical agent transcripts. Removed from the tree in 8d319d8 and
    # gitignored since, but retained in git history, which this project does not
    # rewrite (force-push is prohibited). They hold captured request/response
    # traffic, including a Clockify sandbox API key that reached the public
    # remote. Muting them stops the scanner re-reporting history it cannot
    # change; it is NOT a judgement that the contents were harmless. The remedy
    # for an exposed credential is rotation. See docs/rejected-findings.md.
    '''^\.pi-subagents/''',
    '''^\.ai-audit/''',
]

# Clockify credentials, which no upstream rule covers — and this repository
# exists to talk to Clockify. Anchored on the header and env-var names the SDK
# actually uses, then requiring 40+ characters of key material, so a short
# placeholder like `apiKey: "drift-check"` stays quiet.
#
# The character class includes `.` so a JWT add-on token matches: its first dot
# falls around character 36, and without `.` the match dies before reaching the
# 40-character minimum. The upstream `jwt` rule would also catch a bare JWT, but
# relying on that would leave this rule silently failing half of what its own
# description claims to cover.
[[rules]]
id = "clockify-credential"
description = "Clockify API key or add-on token"
regex = '''(?i)\b(?:x-api-key|x-addon-token|clockify[_-]?api[_-]?key|clockify[_-]?addon[_-]?token|apikey|addontoken)\b["']?\s*[:=]\s*["']?([A-Za-z0-9+/=._-]{40,})'''
secretGroup = 1
keywords = [
    "x-api-key",
    "x-addon-token",
    "clockify_api_key",
    "clockify-api-key",
    "apikey",
    "addontoken",
]
