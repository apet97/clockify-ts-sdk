# gitleaks configuration for clockify-ts-sdk.
#
# Adding an entry here is a security decision. State what the matched string
# actually is and why it cannot authenticate anything.
#
# Scope every allowlist as narrowly as it will go, and verify the scoping
# empirically — `scripts/gitleaks-config.test.sh` does exactly that, and exists
# because two earlier versions of this file got the mechanism wrong in opposite
# directions. Measured against gitleaks 8.30.1:
#
# - A `paths` entry excludes the matching file from scanning ENTIRELY. Adding
#   `regexes` and `condition = "AND"` narrows which *files* the allowlist
#   applies to, but does not re-scan the ones it does apply to. Any secret in
#   an allowlisted file is unreported, whatever its shape.
# - A `regexes`-only allowlist applies repo-wide. That is the wider blast
#   radius: `^[0-9a-f]{64}$` alone silences every hex-encoded 256-bit secret in
#   the repository, which is the shape most signing keys take.
#
# So: prefer `paths` + `condition = "AND"`, and keep the path list short and
# pointed at generated files, where a human will never write a credential.
# Never allowlist a bare shape with no path.

[extend]
useDefault = true

# Content hashes, not credentials. The live-evidence attestation chain records
# a SHA-256 of every governed campaign input, and a bare 64-hex string trips
# the generic-api-key entropy rule.
#
# These three files are wholly excluded, which is the cost of the mechanism.
# It is an acceptable cost only because all three are written by
# `scripts/record-live-evidence-currentness.mjs` and the campaign runner from
# fixed templates of hashes and timestamps — no code path puts a credential in
# them. The blast radius is these three names and nothing else: a 64-hex secret
# in any other file, including a hex-encoded signing key, is still reported.
[[allowlists]]
description = "SHA-256 input hashes in the live-evidence attestation files"
condition = "AND"
paths = [
    '''docs/live-evidence-currentness\.json''',
    '''spec/evidence/live-evidence-campaign-receipt\.json''',
    '''spec/evidence/live-evidence-manifest\.json''',
]
regexes = ['''^[0-9a-f]{64}$''']
regexTarget = "secret"

# Negative-test fixtures. This suite asserts the MCPB bundler REFUSES to ship a
# bundle containing npm credentials, so these strings are the input the test
# scans for. Matched on their self-labelling AND their file, so a real token
# pasted into the same file is still reported.
[[allowlists]]
description = "Deliberately fake npm tokens in the MCPB credential-leak test"
condition = "AND"
paths = ['''scripts/mcpb-artifacts\.test\.mjs''']
regexes = ['''not[-_]a[-_]real[-_]token''', '''^bnBtOm5vdC1hLXJlYWwtdG9rZW4=$''', '''^bnBtX3Bhc3N3b3Jk$''']
regexTarget = "secret"

# Historical agent transcripts. Removed from the tree in 8d319d8 and gitignored
# since, but retained in git history, which this project does not rewrite
# (force-push is prohibited). They hold captured request/response traffic,
# including a Clockify sandbox API key that reached the public remote.
#
# This is a whole-file mute and is meant to be: the scanner cannot fix history.
# It is NOT a judgement that the contents were harmless. The remedy for an
# exposed credential is rotation, and any key that appears under these paths
# must be treated as public and rotated. Recorded in docs/rejected-findings.md.
#
# Both directories are gitignored, so a new file cannot arrive here by accident
# — though `git add -f` bypasses that, so this is a convention, not a wall.
[[allowlists]]
description = "Untracked, gitignored agent-transcript directories retained in history"
paths = ['''^\.pi-subagents/''', '''^\.ai-audit/''']

# Clockify credentials, which no upstream rule covers — and this repository
# exists to talk to Clockify. Anchored on the header and env-var names the SDK
# actually uses, then requiring 40+ characters of key material, so a short
# placeholder like `apiKey: "drift-check"` stays quiet.
#
# The character class includes `.` so a JWT add-on token matches: its first dot
# falls around character 36, and without `.` the match dies before reaching the
# 40-character minimum. The upstream `jwt` rule would also catch a bare JWT, but
# relying on that would leave this rule silently failing half of what its own
# description claims to cover.
[[rules]]
id = "clockify-credential"
description = "Clockify API key or add-on token"
regex = '''(?i)\b(?:x-api-key|x-addon-token|clockify[_-]?api[_-]?key|clockify[_-]?addon[_-]?token|apikey|addontoken)\b["']?\s*[:=]\s*["']?([A-Za-z0-9+/=._-]{40,})'''
secretGroup = 1
keywords = [
    "x-api-key",
    "x-addon-token",
    "clockify_api_key",
    "clockify-api-key",
    "apikey",
    "addontoken",
]
